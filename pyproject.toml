[project]
name = "roth"
version = "0.1.0"
description = "Options research harness for SPY/QQQ hypothesis testing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb==1.1.3",
    "pyarrow==18.1.0",
    "polars==1.17.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "httpx==0.28.1",
    "typer==0.15.1",
    "click==8.1.8",  # typer 0.15.x is incompatible with click >=8.2 (make_metavar signature)
    "rich==13.9.4",
    "pandas-market-calendars==4.6.1",
    "pydantic==2.10.4",
    "python-dateutil==2.9.0.post0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[project.scripts]
roth = "roth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
